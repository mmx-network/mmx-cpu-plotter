[package]
name = "mmx-cpu-plotter"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Disk-backed, parallel CPU plotter for MMX"

[workspace]
exclude = ["vendor/vnx-rust", "vendor/mmx-rust-node"]

[dependencies]
anyhow = "1"
bech32 = "0.9"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
getrandom = "0.2"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = ["std", "arithmetic"] }
mmx-opencl = { path = "vendor/mmx-rust-node/crates/mmx-opencl" }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
vnx = { path = "vendor/vnx-rust/crates/vnx" }

[build-dependencies]
vnx-codegen = { path = "vendor/vnx-rust/crates/vnx-codegen" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
